podcasts:
  freakshow:
    name: "Freak Show"
    order: 10
    language: de
    episode_id:
      type: podlove_number
    sources:
      - type: podlove
        api_base: "https://freakshow.fm/wp-json/podlove/v2"
      # Fallback for episodes PodLove has no transcript for (run sync --fallback).
      - type: apple
        podcast_id: "277518737" # from podcasts.apple.com/.../id277518737
        country: DE
      # Last resort: transcribe audio locally with Whisper. Discovery populates the
      # audio enclosure URLs; run e.g. `sync --source whisper_rss --backfill --limit N`.
      - type: whisper_rss
        feed_url: "https://freakshow.fm/feed/mp3"
    defaults:
      search_words: [apple]

  logbuch_netzpolitik:
    name: "Logbuch:Netzpolitik"
    order: 20
    language: de
    episode_id:
      type: regex
      pattern: "LNP(\\d+)"
    sources:
      - type: podlove
        api_base: "https://logbuch-netzpolitik.de/wp-json/podlove/v2"
      - type: apple
        podcast_id: "476856034" # from podcasts.apple.com/.../id476856034
        country: DE
    defaults:
      search_words: [vorratsdatenspeicherung]

  ukw:
    name: "UKW – Unsere kleine Welt"
    order: 30
    language: de
    episode_id:
      type: regex
      pattern: "UKW(\\d+)"
    sources:
      - type: podlove
        api_base: "https://ukw.fm/wp-json/podlove/v2"
      - type: apple
        podcast_id: "1448029550" # from podcasts.apple.com/.../id1448029550
        country: DE
    defaults:
      search_words: [ukraine]

  chaosradio:
    name: "Chaosradio"
    order: 40
    language: de
    episode_id:
      type: sequential
    sources:
      - type: podlove
        api_base: "https://chaosradio.de//wp-json/podlove/v2"
      - type: apple
        podcast_id: "135057225" # from podcasts.apple.com/.../id135057225
        country: DE
    defaults:
      search_words: [hacken]

  neue_zwanziger:
    name: "Die Neuen Zwanziger"
    order: 50
    language: de
    episode_id:
      type: sequential
    sources:
      - type: podlove
        api_base: "https://neuezwanziger.de/wp-json/podlove/v2"
      - type: apple
        podcast_id: "1492969533" # from podcasts.apple.com/.../id1492969533
        country: DE
    defaults:
      search_words: [hegemonie]

  tribuenengespraech:
    name: "Rasenfunk – Tribünengespräch"
    order: 60
    language: de
    episode_id:
      type: sequential          # assign 1, 2, 3… by release date
    sources:
      - type: apple
        podcast_id: "916269734" # from podcasts.apple.com/.../id916269734
        country: DE
    defaults:
      search_words: [fans]

  ligatour:
    name: "Rasenfunk – Ligatour"
    order: 70
    language: de
    episode_id:
      type: sequential          # assign 1, 2, 3… by release date
    sources:
      - type: apple
        podcast_id: "1116351897" # from podcasts.apple.com/.../id1116351897
        country: DE
    defaults:
      search_words: [investor]

  pufo:
    name: "Das Podcast-Ufo"
    order: 80
    language: de
    episode_id:
      type: regex          # regex | podlove_number | sequential
      pattern: "UFO(\\d+)"
    sources:
      - type: whisper_rss
        feed_url: "https://feeds.acast.com/public/shows/podcast-ufo"
    defaults:
      search_words: [eimer, münze, cent]
