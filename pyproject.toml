[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-words"
version = "0.2.0"
description = "Multi-podcast transcript word-frequency analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.0",
    "streamlit>=1.30",
    "pyyaml>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "spacy>=3.7",
    "defusedxml>=0.7.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
whisper = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "accelerate>=0.30",
    "librosa>=0.10",
    "soundfile>=0.12",
]
podlove = []
apple = []
dev = [
    "pytest>=8.0",
    "pip-audit>=2.7",
]

[project.scripts]
podcast-words = "podcast_words.cli:main"

[tool.setuptools]
packages = ["podcast_words", "podcast_words.transcripts", "podcast_words.sources", "podcast_words.pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
