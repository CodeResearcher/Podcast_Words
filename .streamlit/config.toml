# Streamlit hardening defaults. See README "Deploying the app securely".
[browser]
# Do not send usage telemetry to Streamlit.
gatherUsageStats = false

[server]
# Keep cross-site request forgery protection on (default, pinned explicitly).
enableXsrfProtection = true
# This app makes no cross-origin requests; disabling CORS reduces surface.
enableCORS = false
# Run without trying to open a browser (suitable for servers).
headless = true
